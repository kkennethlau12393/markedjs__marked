# abloh.yml - CI reads this from the PR merge base, so changes are reviewed like code.
# Keys: https://abloh.dev/docs#config

# % of mechanical breaks in changed lines your tests must catch.
threshold: 70

# true: below threshold fails abloh's check in CI. Blocks merges only if also
# marked required in branch protection.
enforce: true

# The job in your own CI that abloh's step rides. abloh reads your workflows to
# pick it and proves the choice by running there. Change it to move the step.
# That job runs once per matrix leg, and matrixLeg is the one it rides. abloh's
# step carries an if: that is true on this leg only, so it measures once.
setup:
  job: .github/workflows/tests.yml::UnitTests
  matrixLeg:
    node_version: 20

# How CI rebuilds this project for abloh's check. Comments name the source file.
environment:
  runtimeImage: node:20.20.2-bookworm-slim@sha256:2cf067cfed83d5ea958367df9f966191a942351a2df77d6f0193e162b5febfc0 # Node 20.20.2 (the Node your setup.matrixLeg pins, of your CI matrix [20, lts/*, latest], node >= 20 in package.json), pinned to the digest abloh holds for it
  installDirectory: .
  setup: .abloh/setup.sh # written by init and yours to edit. Every cold run executes it step by step
  testCommand: npm run test:unit # set by you
  rebuildCommand: npm run build # test/unit/Hooks.test.js imports ../../lib/marked.esm.js
