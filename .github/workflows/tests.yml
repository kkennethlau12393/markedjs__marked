name: "Tests"
on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  UnitTests:
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        # lowest version here should also be in `engines` field
        node_version: [20, "lts/*", "latest"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node_version }}
          check-latest: true
      - name: Install Dependencies
        run: npm ci
      - name: Build 🗜️
        run: npm run build
      - name: Run Unit Tests 👩🏽‍💻
        run: npm run test:unit
      - name: Run Spec Tests 👩🏽‍💻
        run: npm run test:specs
      - name: Run CJS Tests 👩🏽‍💻
        run: npm run test:cjs
      # abloh. It sits right after "Run CJS Tests 👩🏽‍💻", the step that runs your suite
      # on this leg, so it measures the tree your suite ran in and rebuilds nothing of
      # yours. It puts that tree back exactly as it found it, so the steps below still see
      # what they always saw.
      # It installs its own CLI - and its own Node, if this runner's is older than 20.6 -
      # under RUNNER_TEMP, leaving your PATH alone.
      # model-token is abloh's own credential for this repository, kept in your Actions
      # secrets. GitHub hands a secret to the step that names it and to no other step,
      # which is why abloh asks for one instead of a job-wide id-token permission.
      # The if: runs it even when an earlier step of yours failed, so it says so rather
      # than vanishing. It reports on this pull request and gates nothing until merge,
      # and it files none of that itself - the abloh-publish job below does, because
      # this job holds no permission to. Pinned to a commit, because a tag can be moved.
      # The rest of the if: pins it to the one leg named in abloh.yml's setup.matrixLeg,
      # so this job still fans out and abloh measures once instead of once per leg.
      # ADDED BY THE ABLOH FIRST-CONTACT CENSUS: this run reports to https://api.staging.abloh.dev rather than
      # the published control plane, so the model half is measured against the gateway that
      # deployment runs. Recorded in every row this workflow produced.
      - name: Abloh census - point this job at https://api.staging.abloh.dev
        run: |
          set -euo pipefail
          {
            echo "ABLOH_DEV_HANDOFF_URL=https://api.staging.abloh.dev/api/v1/runs"
            echo "ABLOH_DEV_MODEL_GATEWAY_URL=https://api.staging.abloh.dev/api/v1/model/chat/completions"
            echo "ABLOH_DEV_LIVE_PROGRESS_URL=https://api.staging.abloh.dev/api/v1/runs/live-progress"
            echo "ABLOH_DEV_CHECK_ADMISSION_URL=https://api.staging.abloh.dev/api/v1/runs/admission"
            echo "ABLOH_DEV_SETUP_TRIAL_URL=https://api.staging.abloh.dev/api/v1/setup/trial"
            echo "ABLOH_EXPERIMENT_ONE_BUG_ASKS=1"
          } >> "$GITHUB_ENV"
      - name: Abloh
        if: ${{ !cancelled() && matrix.node_version == '20' }}
        uses: kkennethlau12393/abloh-action-census@7d6a0c6ec46c297a7a596754d907bef0c6994ebb
        with:
          # ADDED BY THE ABLOH FIRST-CONTACT CENSUS: this run measures a build of the product
          # rather than the published CLI. Recorded in every row this workflow produced.
          cli-tarball: .abloh-census/engine/abloh-cli-1.0.2.tgz .abloh-census/engine/abloh-aster-1.0.2.tgz .abloh-census/engine/abloh-core-1.0.2.tgz .abloh-census/engine/abloh-marigold-1.0.2.tgz .abloh-census/engine/abloh-measure-1.0.2.tgz .abloh-census/engine/abloh-repository-1.0.2.tgz .abloh-census/engine/abloh-triage-1.0.2.tgz
          base: ${{ github.event.pull_request.base.sha }}
          job-status: ${{ job.status }}
          publish: attestation-job
          model-token: ${{ secrets.ABLOH_MODEL_TOKEN }}
      # ---------------------------------------------------------------------------------
      # ADDED BY THE ABLOH FIRST-CONTACT CENSUS, and these are the only lines of this file
      # that are not what `abloh init` wrote. It keeps the run's own artifact so the
      # census can classify from evidence rather than from this job's log. It runs after
      # everything Abloh does and cannot reach what was measured.
      # ---------------------------------------------------------------------------------
      - name: census - keep the run artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: abloh-census-evidence-${{ github.job }}-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/abloh/${{ github.run_id }}-${{ github.run_attempt }}/abloh-run.json
            ${{ runner.temp }}/abloh/${{ github.run_id }}-${{ github.run_attempt }}/abloh-evidence-manifest.json
            ${{ runner.temp }}/abloh/${{ github.run_id }}-${{ github.run_attempt }}/attest-results.json
            ${{ runner.temp }}/abloh/${{ github.run_id }}-${{ github.run_attempt }}/attest-summary.md
            ${{ runner.temp }}/abloh/${{ github.run_id }}-${{ github.run_attempt }}/abloh-engine-v2-proofs.json
            ${{ runner.temp }}/abloh/${{ github.run_id }}-${{ github.run_attempt }}/abloh-sweep.json
            ${{ runner.temp }}/abloh/${{ github.run_id }}-${{ github.run_attempt }}/abloh-sweep-summary.json
            ${{ runner.temp }}/abloh/${{ github.run_id }}-${{ github.run_attempt }}/abloh-sweep-preceding-refusal.json
            ${{ runner.temp }}/abloh/${{ github.run_id }}-${{ github.run_attempt }}/abloh-refusal.json
          if-no-files-found: ignore
          retention-days: 30

  OtherTests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
      - name: Install Dependencies
        run: npm ci
      - name: Build 🗜️
        run: npm run build
      - name: Run UMD Tests 👩🏽‍💻
        run: npm run test:umd
      - name: Run Types Tests 👩🏽‍💻
        run: npm run test:types
      - name: Lint ✨
        run: npm run test:lint

  Release:
    permissions:
      contents: write # to be able to publish a GitHub release
      # issues: write # to be able to comment on released issues
      # pull-requests: write # to be able to comment on released pull requests
      id-token: write # to enable use of OIDC for trusted publishing and npm provenance
    needs: [UnitTests, OtherTests]
    if: |
      github.ref == 'refs/heads/master' &&
      github.event.repository.fork == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
      - name: Install Dependencies
        run: npm ci
      - name: Build 🗜️
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export SEMANTIC_RELEASE_NEXT_VERSION=$(npx semantic-release --no-ci --dry-run | grep -oP 'The next release version is \K[0-9]+\.[0-9]+\.[0-9]+')
          echo "Next Version: $SEMANTIC_RELEASE_NEXT_VERSION"
          npm run build
          if ! git diff --quiet; then
            git config --global user.email "<>"
            git config --global user.name "MarkedJS bot"
            git commit -am "🗜️ build v$SEMANTIC_RELEASE_NEXT_VERSION [skip ci]"
          fi
      - name: Release 🎉
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
  # abloh's publish job. It runs no code of yours, builds nothing and measures nothing:
  # it takes the report the abloh step above left on this run and files it.
  #
  # It is a separate job because GitHub grants id-token: write to a whole JOB and
  # not to one step: putting it on the job that measures would hand the same identity to
  # every step that runs there, abloh's and everybody else's. Here it reaches abloh's
  # step and nothing else. It authorizes one thing, filing this report with abloh, and
  # carries no write access to your repository. Declaring the block below takes no
  # grant away from anything, because this job is new and had none.
  abloh-publish:
    needs: UnitTests
    # Runs even when the job above failed - a trial that stopped is the report you need.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Abloh publish
        uses: kkennethlau12393/abloh-action-census/attest@7d6a0c6ec46c297a7a596754d907bef0c6994ebb
        # ADDED BY THE ABLOH FIRST-CONTACT CENSUS: this job files its report at the control
        # plane below rather than at the published one. Recorded in every row it produced.
        with:
          control-plane: https://api.staging.abloh.dev
